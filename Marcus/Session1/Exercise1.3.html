<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIZ1 – Exercise 1.3</title>
    <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h1>Exercise 1.3 – Format the Data</h1>
    <ol type="a">
        <li>Write a function that formats a datum into an array of <code>{ date, type, value }</code> objects.</li>
        <li>Create an array with all formatted data using <code>flatMap()</code>.</li>
    </ol>
    <p>Inspect <code>formattedData</code> in the browser console.</p>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // Exercise 1.3 – Format the Data
        // a) Write a function that formats a datum into an array like:
        // [
        //   { date: Date, type: "bar Horsens", value: 0 },
        //   { date: Date, type: "cafe Horsens", value: 42 },
        //   { date: Date, type: "pizza Horsens", value: 41 }
        // ]
        // b) Create an array with all formatted data using flatMap().
        const dataPath = "../Selection/data/going_out_in_horsens_kw.json";
        const types = ["bar Horsens", "cafe Horsens", "pizza Horsens"];
        const parseDate = d3.timeParse("%Y-%m-%dT%H:%M:%S.%L");

        // a) Converts one original Google Trends object into three formatted objects.
        function formatDatum(datum) {
            return types.map(type => ({
                date: parseDate(datum.date),
                type: type,
                value: datum[type]
            }));
        }

        d3.json(dataPath).then(rawData => {
            // b) flatMap calls formatDatum for every row and flattens the results.
            const formattedData = rawData.flatMap(formatDatum);
            console.log("Formatted data:", formattedData);
        }).catch(error => console.error("Failed to load data:", error));
    </script>
</body>
</html>
